# Netlify Configuration File
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to change to before starting a build.
  # This is where we will look for package.json/.nvmrc/etc.
  base = "/"

  # Directory (relative to root of your repo) that contains the deploy-ready HTML files and assets generated by the build.
  publish = "build"

  # Default build command.
  command = "CI=false npm run build"

# Redirects for Single Page Application (SPA) client-side routing
# This ensures that all paths are served by index.html so React Router can handle them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Optional: Proxy API requests to your backend (if you want to avoid CORS issues during development/production)
# You can uncomment and update the URL below to point to your deployed backend on Render.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-app.onrender.com/api/:splat"
#   status = 200
#   force = true
