# Render Blueprint Specification
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Backend Web Service
  - type: web
    name: ptsales-backend
    env: node
    region: ohio # or frankfurt, oregon, singapore
    plan: free # or starter, standard, pro
    rootDirectory: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0 # Or your preferred Node version
      - key: MONGODB_URI
        sync: false # Set this in the Render dashboard manually for security
      - key: JWT_SECRET
        sync: false # Set this in the Render dashboard manually for security
      - key: PORT
        value: 10000 # Render default port, though it injects PORT automatically
      - key: NODE_ENV
        value: production

# Optional: Frontend Web Service (Static Site)
# You can also deploy the frontend on Render if you prefer, but you chose Netlify.
